<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uno Oyunu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- PASS & PLAY OVERLAY -->
  <div id="handoff-overlay" class="overlay hidden">
    <div class="overlay-box">
      <div class="overlay-icon">🂠</div>
      <h2 id="handoff-title">Sıra Oyuncu 2'de</h2>
      <p id="handoff-desc">Cihazı Oyuncu 2'ye ver.<br>Hazır olunca butona bas.</p>
      <button id="handoff-btn" class="btn-primary">Hazırım — Kartlarımı Gör</button>
    </div>
  </div>

  <!-- KAZANAN OVERLAY -->
  <div id="win-overlay" class="overlay hidden">
    <div class="overlay-box">
      <div class="overlay-icon">🏆</div>
      <h2 id="win-title">Kazanan: Oyuncu 1</h2>
      <p>Tebrikler!</p>
      <button id="restart-btn" class="btn-primary">Yeniden Oyna</button>
    </div>
  </div>

  <!-- OYUN ALANI -->
  <div class="game-container">

    <!-- ÜSTTE RAKİP (GİZLİ) -->
    <div class="player player-top" id="zone-top">
      <div class="player-label">
        <span id="label-top">Oyuncu 2</span>
        <span class="card-count" id="count-top"></span>
      </div>
      <div id="cards-top" class="card-list hidden-hand"></div>
    </div>

    <!-- ORTA: DESTE + MASA -->
    <div class="table-area">
      <div class="deck-pile" id="deck-pile">
        <span id="deck-count">40</span>
      </div>
      <div id="masa" class="card masa-card"></div>
    </div>

    <!-- ALTTA AKTİF OYUNCU -->
    <div class="player player-bottom" id="zone-bottom">
      <div class="player-label">
        <span id="label-bottom">Oyuncu 1</span>
        <span class="turn-badge">Senin sıran</span>
      </div>
      <div id="cards-bottom" class="card-list"></div>
    </div>

  </div>

  <script src="assets/js/uno-game.js"></script>
</body>
</html>
